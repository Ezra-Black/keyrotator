[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"
repository = "https://github.com/Ezra-Black/rekey"
homepage = "https://github.com/Ezra-Black/rekey"
authors = ["Ezra Black"]

[workspace.dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
jsonwebtoken = "9"
toml = "0.8"
