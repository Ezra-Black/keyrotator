[package]
name = "rekey-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Provider connectors and rotation engine behind the rekey CLI"
readme = "README.md"
keywords = ["api-keys", "secrets", "rotation"]
categories = ["authentication"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
jsonwebtoken = { workspace = true }
toml = { workspace = true }

# OS keychain support (saved logins and the `keychain` consumer). On by
# default; pure Rust on every platform. Build with --no-default-features to
# leave it out.
keyring = { version = "2", optional = true }

[features]
default = ["os-keyring"]
os-keyring = ["dep:keyring"]

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
