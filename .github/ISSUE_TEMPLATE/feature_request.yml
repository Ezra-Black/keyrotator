name: Feature request
description: A new command, destination (consumer), or behavior change.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you need?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Commands, flags, or config you'd expect.
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I'm willing to open a PR for this
